[project]
name = "wave-mprage-retro-lr-us"
version = "0.1.0"
description = "Retrospective low-resolution and undersampling batch reconstruction for Wave-MPRAGE"
requires-python = ">=3.11,<3.14"
dependencies = [
    "matplotlib>=3.8",
    "nibabel>=5.2",
    "numpy>=1.26,<3",
    "pymapvbvd>=0.6.1",
    "pypulseq>=1.4.2",
    "scipy>=1.11",
    "sigpy>=0.1.27",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]
gpu = ["cupy-cuda12x>=13"]

[tool.uv]
package = false
